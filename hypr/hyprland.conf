# ==============================================================================
# HYPRLAND - CONFIGURAÇÃO ADAPTADA DO MANGO WM
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MONITORES
# ------------------------------------------------------------------------------
monitor = DP-1, 1920x1080@165, 0x0, 1

# ------------------------------------------------------------------------------
# 2. AUTOSTART / EXECUTÁVEIS
# ------------------------------------------------------------------------------
exec-once = wal -R

# ------------------------------------------------------------------------------
# 3. ENTRADA E TECLADO
# ------------------------------------------------------------------------------
input {
    kb_layout = br
    repeat_rate = 25
    repeat_delay = 600
    follow_mouse = 1

    touchpad {
        tap-to-click = true
        tap-and-drag = true
        disable_while_typing = true
    }
}

# ------------------------------------------------------------------------------
# 4. ASPECTO VISUAL E ANIMAÇÕES
# ------------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3

    # Cores convertidas (RGBA no Hyprland)
    col.active_border = rgba(c9b890ff)
    col.inactive_border = rgba(444444ff)

    layout = dwindle
}

decoration {
    rounding = 6

    active_opacity = 1.0
    inactive_opacity = 1.0

    # Desativado para economizar desempenho
    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true

    # Curva suave para animações tipo slide/move
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 3.5, myBezier, slide
    animation = windowsOut, 1, 3.5, myBezier, slide
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ------------------------------------------------------------------------------
# 5. REGRAS DE JANELAS E CAMADAS (LAYER / WINDOW RULES)
# ------------------------------------------------------------------------------
windowrulev2 = float, title:^(Wallpaper Sidebar)$

# Animação estilo Zoom para o Rofi
layerrule = animation popin, rofi

# ------------------------------------------------------------------------------
# 6. ATALHOS DE TECLADO (KEYBINDS)
# ------------------------------------------------------------------------------
$mainMod = SUPER

# --- Sistema / Sessão ---
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod SHIFT, M, exit

# --- Aplicativos Principais ---
bind = $mainMod, Return, exec, foot
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, dolphin
bind = $mainMod, N, togglesplit
bind = $mainMod, H, exec, /home/bocchi/Downloads/random/autostart.sh
bind = $mainMod, K, exec, python3 /home/bocchi/seletor_wallpaper.py
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | tee ~/Imagens/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
bind = $mainMod, B, exec, sh -c 'cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy -t image/png 2>/dev/null || cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy'
bind = $mainMod, P, exec, hyprpicker

# --- Gerenciamento de Janelas ---
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating
bind = $mainMod, Tab, cyclenext

# NAVEGAR entre janelas (Setas)
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# MOVER / TROCAR posição da janela ativa
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

# --- WORKSPACES ---

# MUDAR de Workspace (SUPER + Número)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# MOVER APP para Workspace (SUPER + SHIFT + Número)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# ------------------------------------------------------------------------------
# 7. MOUSE BINDS
# ------------------------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
